[project]
name = "agent-trace-integrity"
version = "0.0.1"
description = "Checks what an AI agent says it did against what its own trace shows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ati = "agent_trace_integrity.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trace_integrity"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs network access to fetch a pinned third-party log (skipped unless ATI_NETWORK_TESTS=1)"]
